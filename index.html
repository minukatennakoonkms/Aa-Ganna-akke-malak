<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glowing Flowers</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 85%, #140902 0%, #050201 55%, #000000 100%);
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Floating fireflies */
    .fireflies span {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #ffd166;
      box-shadow: 0 0 8px 2px rgba(255, 166, 0, 0.85);
      opacity: 0;
      animation: floatParticle var(--d) ease-in-out var(--delay) infinite;
    }

    /* Mobile-first flower sizing so heads don't overlap */
    .flower-container {
      position: absolute;
      bottom: 0;
      left: var(--x, 50%);
      transform: translateX(-50%) scale(calc(var(--scale, 1) * 0.65));
      transform-origin: bottom center;
    }

    /* Desktop full sizing */
    @media (min-width: 769px) {
      .flower-container {
        transform: translateX(-50%) scale(var(--scale, 1));
      }
    }

    .stem {
      position: relative;
      width: 3px;
      height: var(--height, 36vh);
      background: linear-gradient(to top, #2b1405, #7c3a10 55%, #d96b1f 100%);
      box-shadow: 0 0 8px rgba(255, 115, 0, 0.45);
      border-radius: 3px;
      transform: scaleY(0);
      transform-origin: bottom center;
    }

    .flower-container.animate .stem {
      animation:
        growStem 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards,
        sway 4s ease-in-out 1.4s infinite alternate;
    }

    .leaf {
      position: absolute;
      width: 34px;
      height: 11px;
      background: linear-gradient(90deg, #4a2208, #a84d14);
      box-shadow: 0 0 6px rgba(255, 106, 0, 0.35);
      opacity: 0;
    }

    .leaf-left {
      right: 2px;
      border-radius: 100% 0 100% 0;
      transform-origin: right center;
    }

    .leaf-right {
      left: 2px;
      border-radius: 0 100% 0 100%;
      transform-origin: left center;
    }

    .l1 { bottom: 22%; }
    .l2 { bottom: 46%; }
    .l3 { bottom: 70%; }

    .flower-container.animate .leaf-left {
      animation: sproutLeft 0.7s ease-out forwards;
    }

    .flower-container.animate .leaf-right {
      animation: sproutRight 0.7s ease-out forwards;
    }

    .flower-container.animate .l1 { animation-delay: 0.4s; }
    .flower-container.animate .l2 { animation-delay: 0.65s; }
    .flower-container.animate .l3 { animation-delay: 0.9s; }

    /* 6-petal glowing flower head */
    .flower-head {
      position: absolute;
      top: -6px;
      left: 50%;
      width: 20px;
      height: 20px;
      transform: translate(-50%, -50%) scale(0);
    }

    .flower-container.animate .flower-head {
      animation: bloomHead 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 1.1s forwards;
    }

    .petal {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 22px;
      height: 44px;
      background: radial-gradient(circle at 50% 85%, #fff3b0 0%, #ff9e00 35%, #ff5400 80%, #c93200 100%);
      border-radius: 50% 50% 45% 45%;
      transform-origin: bottom center;
      box-shadow: 0 0 16px rgba(255, 110, 0, 0.8), 0 0 32px rgba(255, 75, 0, 0.45);
    }

    .p1 { transform: translate(-50%, -100%) rotate(0deg); }
    .p2 { transform: translate(-50%, -100%) rotate(60deg); }
    .p3 { transform: translate(-50%, -100%) rotate(120deg); }
    .p4 { transform: translate(-50%, -100%) rotate(180deg); }
    .p5 { transform: translate(-50%, -100%) rotate(240deg); }
    .p6 { transform: translate(-50%, -100%) rotate(300deg); }

    .flower-center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 16px;
      height: 16px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #fff3b0 45%, #ff9e00 100%);
      box-shadow: 0 0 14px #fff3b0, 0 0 28px #ff8500;
      z-index: 2;
    }

    @keyframes growStem {
      from { transform: scaleY(0); }
      to { transform: scaleY(1); }
    }

    @keyframes sproutLeft {
      from { opacity: 0; transform: rotate(20deg) scale(0); }
      to { opacity: 0.9; transform: rotate(-28deg) scale(1); }
    }

    @keyframes sproutRight {
      from { opacity: 0; transform: rotate(-20deg) scale(0); }
      to { opacity: 0.9; transform: rotate(28deg) scale(1); }
    }

    @keyframes bloomHead {
      from { transform: translate(-50%, -50%) scale(0); }
      to { transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes sway {
      0% { transform: scaleY(1) rotate(-1.5deg); }
      100% { transform: scaleY(1) rotate(1.5deg); }
    }

    @keyframes floatParticle {
      0% { transform: translateY(0) scale(0.6); opacity: 0; }
      30% { opacity: 0.9; }
      100% { transform: translateY(-90px) scale(1.1); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="fireflies">
      <span style="--x: 16%; --y: 68%; --d: 6s; --delay: 0s;"></span>
      <span style="--x: 30%; --y: 50%; --d: 8s; --delay: 1.2s;"></span>
      <span style="--x: 52%; --y: 38%; --d: 7s; --delay: 0.5s;"></span>
      <span style="--x: 68%; --y: 26%; --d: 9s; --delay: 2s;"></span>
      <span style="--x: 44%; --y: 58%; --d: 6.5s; --delay: 1.8s;"></span>
      <span style="--x: 80%; --y: 62%; --d: 7.5s; --delay: 0.9s;"></span>
      <span style="--x: 24%; --y: 32%; --d: 8.5s; --delay: 2.5s;"></span>
      <span style="--x: 62%; --y: 74%; --d: 6s; --delay: 1.4s;"></span>
    </div>

    <!-- 0: First hero flower -->
    <div class="flower-container" style="--x: 28%; --scale: 1.1; --height: 46vh;">
      <div class="stem">
        <div class="leaf leaf-left l1"></div><div class="leaf leaf-right l1"></div>
        <div class="leaf leaf-left l2"></div><div class="leaf leaf-right l2"></div>
        <div class="leaf leaf-left l3"></div><div class="leaf leaf-right l3"></div>
        <div class="flower-head">
          <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div>
          <div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div>
          <div class="flower-center"></div>
        </div>
      </div>
    </div>

    <!-- 1-4: Background cluster (2000ms) -->
    <div class="flower-container" style="--x: 12%; --scale: 0.75; --height: 28vh;">
      <div class="stem">
        <div class="leaf leaf-left l1"></div><div class="leaf leaf-right l1"></div>
        <div class="leaf leaf-left l2"></div><div class="leaf leaf-right l2"></div>
        <div class="flower-head">
          <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div>
          <div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div>
          <div class="flower-center"></div>
        </div>
      </div>
    </div>

    <div class="flower-container" style="--x: 47%; --scale: 0.98; --height: 38vh;">
      <div class="stem">
        <div class="leaf leaf-left l1"></div><div class="leaf leaf-right l1"></div>
        <div class="leaf leaf-left l2"></div><div class="leaf leaf-right l2"></div>
        <div class="leaf leaf-left l3"></div><div class="leaf leaf-right l3"></div>
        <div class="flower-head">
          <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div>
          <div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div>
          <div class="flower-center"></div>
        </div>
      </div>
    </div>

    <div class="flower-container" style="--x: 70%; --scale: 1.1; --height: 44vh;">
      <div class="stem">
        <div class="leaf leaf-left l1"></div><div class="leaf leaf-right l1"></div>
        <div class="leaf leaf-left l2"></div><div class="leaf leaf-right l2"></div>
        <div class="leaf leaf-left l3"></div><div class="leaf leaf-right l3"></div>
        <div class="flower-head">
          <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div>
          <div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div>
          <div class="flower-center"></div>
        </div>
      </div>
    </div>

    <div class="flower-container" style="--x: 87%; --scale: 0.78; --height: 27vh;">
      <div class="stem">
        <div class="leaf leaf-left l1"></div><div class="leaf leaf-right l1"></div>
        <div class="leaf leaf-left l2"></div><div class="leaf leaf-right l2"></div>
        <div class="flower-head">
          <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div>
          <div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div>
          <div class="flower-center"></div>
        </div>
      </div>
    </div>

    <!-- 5-7: Sequential foreground flowers (1500ms interval) -->
    <div class="flower-container" style="--x: 21%; --scale: 0.85; --height: 31vh;">
      <div class="stem">
        <div class="leaf leaf-left l1"></div><div class="leaf leaf-right l1"></div>
        <div class="leaf leaf-left l2"></div><div class="leaf leaf-right l2"></div>
        <div class="flower-head">
          <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div>
          <div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div>
          <div class="flower-center"></div>
        </div>
      </div>
    </div>

    <div class="flower-container" style="--x: 59%; --scale: 0.88; --height: 30vh;">
      <div class="stem">
        <div class="leaf leaf-left l1"></div><div class="leaf leaf-right l1"></div>
        <div class="leaf leaf-left l2"></div><div class="leaf leaf-right l2"></div>
        <div class="flower-head">
          <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div>
          <div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div>
          <div class="flower-center"></div>
        </div>
      </div>
    </div>

    <div class="flower-container" style="--x: 37%; --scale: 0.78; --height: 25vh;">
      <div class="stem">
        <div class="leaf leaf-left l1"></div><div class="leaf leaf-right l1"></div>
        <div class="leaf leaf-left l2"></div><div class="leaf leaf-right l2"></div>
        <div class="flower-head">
          <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div>
          <div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div>
          <div class="flower-center"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const flowers = Array.from(
      document.querySelectorAll(".flower-container")
    );

    const animatedClass = "animate";

    flowers[0].classList.add(animatedClass);

    setTimeout(() => {
      for (let i = 1; i <= 4 && i < flowers.length; i++) {
        flowers[i].classList.add(animatedClass);
      }
    }, 2000);

    const remaining = flowers.slice(5);

    const interval = setInterval(() => {
      if (remaining.length === 0) {
        clearInterval(interval);
        return;
      }

      const nextFlower = remaining.shift();
      nextFlower.classList.add(animatedClass);
    }, 1500);
  </script>
</body>
</html>
