<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glowing Flower Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100dvh;
      background: radial-gradient(
        ellipse at 50% 100%,
        #1f0d03 0%,
        #090401 48%,
        #000000 88%
      );
      overflow: hidden;
    }

    .ground-glow {
      position: absolute;
      bottom: -50px;
      left: 50%;
      transform: translateX(-50%);
      width: 95%;
      height: 160px;
      background: radial-gradient(
        ellipse at center,
        rgba(255, 115, 0, 0.2) 0%,
        rgba(255, 75, 0, 0.05) 55%,
        transparent 75%
      );
      pointer-events: none;
    }

    /* Flower wrapper */
    .flower-container {
      position: absolute;
      bottom: -4px;
      left: var(--x, 50%);
      transform: translateX(-50%) scale(var(--scale, 1));
      transform-origin: bottom center;
      z-index: var(--z, 1);
      pointer-events: none;
    }

    .flower-sway {
      position: relative;
      width: 140px;
      height: 48vh;
      max-height: 330px;
      min-height: 210px;
      transform-origin: bottom center;
    }

    .flower-container.animate .flower-sway {
      animation: sway 4.5s ease-in-out infinite alternate;
    }

    /* Stem */
    .stem {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 4px;
      height: calc(100% - 64px);
      margin-left: -2px;
      border-radius: 4px;
      background: linear-gradient(
        to top,
        #3d1806 0%,
        #963c0e 55%,
        #d96016 100%
      );
      box-shadow: 0 0 10px rgba(255, 102, 0, 0.4);
      transform: scaleY(0);
      transform-origin: bottom center;
    }

    .flower-container.animate .stem {
      animation: growStem 1.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Leaves */
    .leaves {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: calc(100% - 64px);
    }

    .leaf {
      position: absolute;
      bottom: var(--bottom);
      width: var(--w, 42px);
      height: var(--h, 13px);
      background: linear-gradient(90deg, #4a1c07 0%, #a84512 100%);
      box-shadow: 0 0 8px rgba(255, 95, 0, 0.28);
      opacity: 0;
    }

    .leaf.left {
      right: 2px;
      border-radius: 100% 0 100% 0;
      transform-origin: right center;
      transform: rotate(var(--angle, -28deg)) scale(0);
    }

    .leaf.right {
      left: 2px;
      background: linear-gradient(-90deg, #4a1c07 0%, #a84512 100%);
      border-radius: 0 100% 0 100%;
      transform-origin: left center;
      transform: rotate(var(--angle, 28deg)) scale(0);
    }

    .flower-container.animate .leaf {
      animation: sproutLeaf 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: var(--delay, 0.45s);
    }

    /* Blossom head */
    .flower-head {
      position: absolute;
      top: 64px;
      left: 50%;
      width: 0;
      height: 0;
      transform: scale(0);
      filter: drop-shadow(0 0 16px rgba(255, 115, 0, 0.8));
    }

    .flower-container.animate .flower-head {
      animation: bloomHead 1.05s cubic-bezier(0.16, 1, 0.3, 1) 1.3s forwards;
    }

    /* Petals */
    .petal {
      position: absolute;
      bottom: 0;
      left: -15px;
      width: 30px;
      height: 54px;
      border-radius: 50% 50% 45% 45% / 72% 72% 28% 28%;
      background: radial-gradient(
        circle at 50% 85%,
        #ff3b00 0%,
        #ff7700 52%,
        #ffc300 96%
      );
      box-shadow:
        0 0 16px rgba(255, 115, 0, 0.85),
        inset 0 -7px 12px rgba(185, 28, 0, 0.65);
      transform-origin: bottom center;
      transform: rotate(var(--r)) translateY(-4px) scale(0.2);
      opacity: 0.94;
    }

    .flower-container.animate .petal {
      animation: openPetal 0.95s cubic-bezier(0.16, 1, 0.3, 1) 1.35s forwards;
    }

    /* Glowing center */
    .flower-center {
      position: absolute;
      top: -11px;
      left: -11px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        #ffffff 0%,
        #fff3b0 45%,
        #ff9e00 85%,
        transparent 100%
      );
      box-shadow:
        0 0 12px #fff3b0,
        0 0 24px #ff9e00,
        0 0 38px #ff5400;
      z-index: 2;
    }

    .flower-container.animate .flower-center {
      animation: pulseGlow 2.4s ease-in-out infinite alternate;
    }

    /* Floating ambient particles */
    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      bottom: -10px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #ffb703;
      box-shadow: 0 0 8px #ff8800, 0 0 14px #ffb703;
      opacity: 0;
      animation: floatUp var(--dur, 7s) linear var(--delay, 0s) infinite;
    }

    @keyframes growStem {
      0% { transform: scaleY(0); }
      100% { transform: scaleY(1); }
    }

    @keyframes sproutLeaf {
      0% {
        opacity: 0;
        transform: rotate(var(--angle)) scale(0);
      }
      100% {
        opacity: 0.95;
        transform: rotate(var(--angle)) scale(1);
      }
    }

    @keyframes bloomHead {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    @keyframes openPetal {
      0% { transform: rotate(var(--r)) translateY(-2px) scale(0.2); }
      100% { transform: rotate(var(--r)) translateY(-7px) scale(1); }
    }

    @keyframes pulseGlow {
      0% {
        transform: scale(0.92);
        filter: brightness(0.95);
      }
      100% {
        transform: scale(1.12);
        filter: brightness(1.25);
      }
    }

    @keyframes sway {
      0% { transform: rotate(-2deg); }
      100% { transform: rotate(2deg); }
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      20% { opacity: 0.85; }
      80% { opacity: 0.6; }
      100% {
        transform: translateY(-95vh) translateX(var(--drift, 25px));
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <div class="ground-glow"></div>
    <div class="particles" id="particles"></div>
  </div>

  <script>
    const scene = document.getElementById("scene");

    // Flower positions matching the staggered garden layout
    const flowerSpecs = [
      { x: "43%", scale: 0.92, z: 3 }, // Hero flower
      { x: "24%", scale: 0.72, z: 2 }, // Midground cluster
      { x: "34%", scale: 0.65, z: 1 },
      { x: "53%", scale: 0.78, z: 2 },
      { x: "63%", scale: 0.68, z: 1 },
      { x: "75%", scale: 1.05, z: 4 }, // Staggered foreground & background
      { x: "27%", scale: 1.15, z: 5 },
      { x: "14%", scale: 0.62, z: 1 },
      { x: "85%", scale: 0.64, z: 1 }
    ];

    const leafConfigs = [
      { side: "left",  bottom: "12%", w: "44px", h: "13px", angle: "-24deg", delay: "0.25s" },
      { side: "right", bottom: "20%", w: "46px", h: "13px", angle: "24deg",  delay: "0.35s" },
      { side: "left",  bottom: "32%", w: "42px", h: "12px", angle: "-28deg", delay: "0.48s" },
      { side: "right", bottom: "42%", w: "40px", h: "12px", angle: "28deg",  delay: "0.60s" },
      { side: "left",  bottom: "54%", w: "36px", h: "11px", angle: "-32deg", delay: "0.72s" },
      { side: "right", bottom: "64%", w: "34px", h: "11px", angle: "32deg",  delay: "0.84s" },
      { side: "left",  bottom: "76%", w: "28px", h: "10px", angle: "-35deg", delay: "0.96s" },
      { side: "right", bottom: "84%", w: "26px", h: "10px", angle: "35deg",  delay: "1.08s" }
    ];

    // Build flowers dynamically
    const flowers = flowerSpecs.map((spec) => {
      const container = document.createElement("div");
      container.className = "flower-container";
      container.style.setProperty("--x", spec.x);
      container.style.setProperty("--scale", spec.scale);
      container.style.setProperty("--z", spec.z);

      const sway = document.createElement("div");
      sway.className = "flower-sway";

      const stem = document.createElement("div");
      stem.className = "stem";

      const leaves = document.createElement("div");
      leaves.className = "leaves";
      leafConfigs.forEach((cfg) => {
        const leaf = document.createElement("div");
        leaf.className = `leaf ${cfg.side}`;
        leaf.style.setProperty("--bottom", cfg.bottom);
        leaf.style.setProperty("--w", cfg.w);
        leaf.style.setProperty("--h", cfg.h);
        leaf.style.setProperty("--angle", cfg.angle);
        leaf.style.setProperty("--delay", cfg.delay);
        leaves.appendChild(leaf);
      });

      const head = document.createElement("div");
      head.className = "flower-head";
      for (let deg = 0; deg < 360; deg += 60) {
        const petal = document.createElement("div");
        petal.className = "petal";
        petal.style.setProperty("--r", `${deg}deg`);
        head.appendChild(petal);
      }

      const center = document.createElement("div");
      center.className = "flower-center";
      head.appendChild(center);

      sway.append(stem, leaves, head);
      container.appendChild(sway);
      scene.appendChild(container);
      return container;
    });

    // Floating glowing particles
    const particlesContainer = document.getElementById("particles");
    for (let i = 0; i < 28; i++) {
      const dot = document.createElement("div");
      dot.className = "particle";
      dot.style.left = `${Math.random() * 100}%`;
      dot.style.setProperty("--dur", `${6 + Math.random() * 6}s`);
      dot.style.setProperty("--delay", `${Math.random() * 6}s`);
      dot.style.setProperty("--drift", `${(Math.random() - 0.5) * 80}px`);
      particlesContainer.appendChild(dot);
    }

    // Staggered bloom sequence
    const animatedClass = "animate";
    flowers[0].classList.add(animatedClass);

    setTimeout(() => {
      for (let i = 1; i <= 4 && i < flowers.length; i++) {
        flowers[i].classList.add(animatedClass);
      }

      const remaining = flowers.slice(5);
      const interval = setInterval(() => {
        if (remaining.length === 0) {
          clearInterval(interval);
          return;
        }
        remaining.shift().classList.add(animatedClass);
      }, 950);
    }, 2300);
  </script>
</body>
</html>
